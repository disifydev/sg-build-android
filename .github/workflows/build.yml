name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: google-services.json из секрета
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json; echo "есть"; else echo "секрета нет, сборка без Firebase"; fi

      - name: Сборка debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Снимки экранов (Roborazzi, демо-режим)
        run: gradle :app:recordRoborazziDebug --continue --stacktrace

      - name: APK в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sguardo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Снимки в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/screenshots
          if-no-files-found: warn

      - name: Отчёт тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Снимки в ветку shots
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d app/screenshots ] || exit 0
          mkdir -p /tmp/shots && cp -r app/screenshots/. /tmp/shots/
          cd /tmp/shots
          git init -q && git checkout -q -b shots
          git config user.name "sguardo-ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "Снимки для ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shots
