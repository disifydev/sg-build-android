name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: google-services.json из секрета
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json; echo "есть"; else echo "секрета нет, сборка без Firebase"; fi

      - name: Сборка debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Снимки экранов (Roborazzi, демо-режим)
        run: gradle :app:recordRoborazziDebug --continue --stacktrace

      - name: Графика для Google Play (иконка 512, feature graphic)
        if: always()
        run: |
          pip install --quiet pillow
          python3 tools/store_assets.py app/screenshots/play

      - name: Промо-кадры в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-screens
          path: app/screenshots/play
          if-no-files-found: warn

      - name: APK в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sguardo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Снимки в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/screenshots
          if-no-files-found: warn

      - name: Отчёт тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Снимки в ветку shots
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d app/screenshots ] || exit 0
          mkdir -p /tmp/shots && cp -r app/screenshots/. /tmp/shots/
          cd /tmp/shots
          git init -q && git checkout -q -b shots
          git config user.name "sguardo-ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "Снимки для ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shots

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: google-services.json и ключ загрузки из секретов
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Подписанный AAB и APK для проверки (R8)
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Удалить ключ с раннера
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: AAB в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: sguardo-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Запуск релиза на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: mkdir -p smoke && bash tools/smoke.sh

      - name: Снимки и лог проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke
          path: smoke
          if-no-files-found: ignore
